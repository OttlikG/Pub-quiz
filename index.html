<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pub Quiz" />
  <meta name="format-detection" content="telephone=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Pub Quiz</title>
  <link rel="stylesheet" href="styles.css?v=12" />
</head>
<body>
  <header class="topbar">
    <h1 id="title">Pub Quiz</h1>
    <button id="reset-btn" class="ghost" title="Start again">Start again</button>
  </header>

  <main id="app">
    <!-- screens are swapped in by app.js -->
  </main>

  <aside id="leaderboard" class="hidden">
    <h2>Leaderboard</h2>
    <ol id="leaderboard-list"></ol>
  </aside>

  <template id="tpl-setup">
    <section class="card">
      <h2>Setup</h2>
      <div class="field">
        <label for="quiz-title"><span>Quiz title</span></label>
        <div class="title-row">
          <input type="text" id="quiz-title" maxlength="60" placeholder="Friday Night Pub Quiz" />
          <button type="button" id="title-random" class="title-random" title="Generate a fantasy name" aria-label="Generate a fantasy name">
            <span aria-hidden="true">✨</span>
          </button>
        </div>
      </div>

      <div class="field">
        <span>Players</span>
        <form id="player-form" class="inline">
          <input type="text" id="player-name" maxlength="24" placeholder="Player name" required />
          <button type="submit">Add</button>
        </form>
        <ul id="player-list" class="chips"></ul>
      </div>

      <div class="field" id="saved-players-field">
        <span>Saved players &mdash; tap to include</span>
        <ul id="saved-list" class="chips selectable"></ul>
        <p class="hint" id="saved-empty-hint">Players you add will show up here next time.</p>
      </div>

      <p class="hint">Add at least 2 players, then start the quiz. The final round is always a pass-the-phone round on a single topic — each player answers a short set of questions on their own.</p>
      <button id="start-btn" class="primary" disabled>Start quiz</button>
    </section>
  </template>

  <template id="tpl-pass-picker">
    <section class="card center">
      <p class="muted">Pass-the-phone round &middot; <span id="picker-progress"></span></p>
      <h2 id="picker-title">Who's next?</h2>
      <p class="hint">Tap a player&mdash;they'll get a fresh question from the same topic.</p>
      <div id="picker-players" class="picker-grid"></div>
    </section>
  </template>

  <template id="tpl-pass-handoff">
    <section class="card center">
      <p class="muted">Pass-the-phone round &middot; <span id="pass-progress"></span></p>
      <h2>Hand the phone to <span id="pass-player"></span></h2>
      <p class="hint" id="pass-hint">When you're holding the phone and ready, tap the button.</p>
      <button id="pass-ready" class="primary">I'm ready</button>
    </section>
  </template>

  <template id="tpl-round-intro">
    <section class="card center">
      <p class="muted">Round <span id="intro-num"></span> of 6</p>
      <h2 id="intro-title"></h2>
      <p id="intro-desc" class="hint"></p>
      <button id="intro-start" class="primary">Begin round</button>
    </section>
  </template>

  <template id="tpl-question">
    <section class="card">
      <div class="row between">
        <span class="muted">Round <span id="q-round"></span> &middot; Question <span id="q-num"></span>/<span id="q-total"></span></span>
        <span class="muted" id="q-category"></span>
      </div>
      <h2 id="q-text"></h2>
      <p id="q-author" class="muted hidden"></p>

      <div id="q-options" class="options"></div>

      <div id="q-answer" class="answer hidden">
        <span class="label">Answer:</span>
        <span id="q-answer-text"></span>
      </div>

      <div class="row">
        <button id="q-next" class="primary hidden">Who's next?</button>
      </div>
    </section>
  </template>

  <template id="tpl-final">
    <section class="card center">
      <h2>Final leaderboard</h2>
      <p id="final-winner" class="winner"></p>
      <ol id="final-list" class="final-list"></ol>
      <button id="final-reset" class="primary">Start a new quiz</button>
    </section>
  </template>

  <script src="questions.js?v=12"></script>
  <script src="app.js?v=12"></script>
</body>
</html>
